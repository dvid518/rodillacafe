<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodilla — Cargando</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #360e06; color: #ffe8c9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,232,201,0.3); border-top-color: #ffe8c9; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <script>
        // Fallback para hosts estaticos que sirven 404.html en una ruta limpia
        // (ej. /dashboard/ventas). Con el router hash, la ruta vive en el
        // fragmento: se redirige al shell correcto con el hash ya puesto.
        (function () {
            var path = window.location.pathname;
            if (path.length > 1 && path.endsWith("/")) {
                path = path.slice(0, -1);
            }

            var hash = window.location.hash;
            var destino;

            if (path.startsWith("/dashboard")) {
                destino = "/dashboard.html" + (hash || "#" + path);
            } else if (path.startsWith("/auth")) {
                destino = "/auth.html" + (hash || "#/login");
            } else {
                destino = "/index.html" + (hash || "#" + (path === "" || path === "/" ? "/" : path));
            }

            window.location.replace(destino);
        })();
    </script>
</body>
</html>
