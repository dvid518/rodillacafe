<section class="dashboard-crud">
    <section class="hero hero--admin hero--compact">
        <div class="hero__contenido">
            <span class="hero__etiqueta">Módulo</span>
            <h1 class="hero__titulo">Reservas</h1>
            <p class="hero__subtitulo">Administra las reservas de mesas.</p>
            <div class="hero__acciones">
                <button class="btn btn--primary js-solo-admin" type="button" id="reservas-nuevo">+ Nueva reserva</button>
            </div>
        </div>
        <div class="hero__decoracion" aria-hidden="true">
            <re-icon icon="calendar-days" weight="filled"></re-icon>
        </div>
    </section>

    <p class="aviso-permiso" id="reservas-aviso" hidden></p>

    <div class="tabla-container glass">
        <table class="tabla">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Personas</th>
                    <th>Estado</th>
                    <th>Obs.</th>
                    <th title="Editar">(E)</th>
                    <th class="js-solo-admin" title="Eliminar">(D)</th>
                </tr>
            </thead>
            <tbody id="reservas-tbody" aria-busy="true">
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal-form" id="reservas-modal" hidden>
        <div class="modal-form__contenido glass" role="dialog" aria-modal="true" aria-labelledby="reservas-modal-titulo">
            <h2 id="reservas-modal-titulo">Nueva reserva</h2>

            <label class="modal-form__campo" for="reservas-input-cliente">
                Cliente
                <select class="select" id="reservas-input-cliente" required></select>
            </label>

            <label class="modal-form__campo" for="reservas-input-fecha">
                Fecha y hora
                <input class="input" type="datetime-local" id="reservas-input-fecha" required>
            </label>

            <label class="modal-form__campo" for="reservas-input-personas">
                Personas
                <input class="input" type="number" id="reservas-input-personas" value="2" min="1" max="20" step="1" required>
            </label>

            <label class="modal-form__campo" for="reservas-input-estado" id="reservas-campo-estado" hidden>
                Estado
                <select class="select" id="reservas-input-estado"></select>
            </label>

            <label class="modal-form__campo" for="reservas-input-observacion">
                Observación
                <textarea class="textarea textarea--corta" id="reservas-input-observacion" maxlength="200"></textarea>
            </label>

            <div class="modal-form__acciones">
                <button class="btn btn--ghost" type="button" id="reservas-modal-cancelar">Cancelar</button>
                <button class="btn btn--primary" type="button" id="reservas-modal-guardar">Guardar</button>
            </div>
        </div>
    </div>
</section>
