<section class="dashboard-crud">
    <section class="hero hero--admin hero--compact">
        <div class="hero__contenido">
            <span class="hero__etiqueta">Módulo</span>
            <h1 class="hero__titulo">Pedidos</h1>
            <p class="hero__subtitulo">Gestiona los pedidos de clientes.</p>
            <div class="hero__acciones">
                <button class="btn btn--primary js-solo-admin" type="button" id="pedidos-nuevo">+ Nuevo pedido</button>
            </div>
        </div>
        <div class="hero__decoracion" aria-hidden="true">
            <re-icon icon="receipt" weight="filled"></re-icon>
        </div>
    </section>

    <p class="aviso-permiso" id="pedidos-aviso" hidden></p>

    <div class="tabla-container glass">
        <table class="tabla">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Detalle</th>
                    <th title="Editar">(E)</th>
                    <th class="js-solo-admin" title="Eliminar">(D)</th>
                </tr>
            </thead>
<tbody id="pedidos-tbody" aria-busy="true">
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
                <tr class="esqueleto-fila" aria-hidden="true">
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto skeleton--corto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--texto"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                    <td><span class="skeleton skeleton--icono"></span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Todos los modales arrancan con hidden: .modal-form es fixed/inset 0 -->
    <div class="modal-form" id="pedidos-modal" hidden>
        <div class="modal-form__contenido glass venta-modal" role="dialog" aria-modal="true" aria-labelledby="pedidos-modal-titulo">
            <h2 id="pedidos-modal-titulo">Nuevo pedido</h2>

            <div class="venta-modal__cuerpo">
                <!-- Izquierda: productos -->
                <aside class="venta-panel venta-panel--productos">
                    <div class="venta-panel__header">
                        <h3>Productos</h3>
                        <div class="venta-panel__buscar">
                            <re-icon icon="search" weight="filled" size="18" decorative></re-icon>
                            <input class="input input--sm" type="search" id="pedidos-buscar-producto" placeholder="Buscar producto...">
                        </div>
                    </div>
                    <div class="venta-panel__productos" id="pedidos-productos"></div>
                    <div class="venta-panel__vacio" id="pedidos-productos-vacio" hidden>No se encontraron productos.</div>
                </aside>

                <!-- Derecha: datos de la venta -->
                <aside class="venta-panel venta-panel--venta">
                    <div class="venta-campo">
                        <label class="venta-label">Cliente</label>
                        <div class="venta-cliente-wrap">
                            <input class="input input--sm" type="search" id="pedidos-buscar-cliente" placeholder="Buscar cliente...">
                            <select class="select input--sm" id="pedidos-input-cliente"></select>
                            <button class="btn btn--ghost btn--sm" type="button" id="pedidos-nuevo-cliente" title="Nuevo cliente"><re-icon icon="plus" weight="filled" size="16" decorative></re-icon></button>
                        </div>
                    </div>

                    <div class="venta-campo">
                        <label class="venta-label">Tipo de atención</label>
                        <select class="select input--sm" id="pedidos-input-tipo" required></select>
                    </div>

                    <div class="venta-campo">
                        <label class="venta-label">Comensales</label>
                        <input class="input input--sm" type="number" id="pedidos-input-comensales" value="1" min="1" step="1">
                    </div>

                    <div class="venta-campo">
                        <label class="venta-label">Observación</label>
                        <textarea class="input input--sm" id="pedidos-input-observacion" maxlength="200"></textarea>
                    </div>

                    <div class="venta-total">
                        <span class="venta-total__etiqueta">Total</span>
                        <span class="venta-total__valor" id="pedidos-total">S/ 0.00</span>
                    </div>

                    <div class="venta-modal__acciones">
                        <button class="btn btn--ghost" type="button" id="pedidos-modal-cancelar">Cancelar</button>
                        <button class="btn btn--primary" type="button" id="pedidos-modal-guardar">Guardar pedido</button>
                        <button class="btn btn--primary" type="button" id="pedidos-modal-guardar-venta">Guardar y procesar venta</button>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <div class="modal-form" id="pedidos-detalle-modal" hidden>
        <div class="modal-form__contenido glass" role="dialog" aria-modal="true" aria-labelledby="pedidos-detalle-titulo">
            <h2 id="pedidos-detalle-titulo">Detalle del pedido</h2>
            <div class="detalle" id="pedidos-detalle-contenido"></div>
            <div class="modal-form__acciones">
                <button class="btn btn--ghost" type="button" id="pedidos-detalle-cerrar">Cerrar</button>
            </div>
        </div>
    </div>
</section>
