<section class="auth-split">
    <aside class="hero hero--auth hero--compact auth-split__hero">
        <div class="hero__contenido">
            <h1 class="hero__titulo">Bienvenido a Rodilla</h1>
            <p class="hero__subtitulo">
                Tu cafetería de especialidad favorita, ahora más cerca.
            </p>
            <ul class="hero__lista">
                <li>
                    <re-icon icon="check" weight="filled" size="18"></re-icon>
                    <span>Pide desde cualquier dispositivo</span>
                </li>
                <li>
                    <re-icon icon="check" weight="filled" size="18"></re-icon>
                    <span>Reserva tu mesa en segundos</span>
                </li>
                <li>
                    <re-icon icon="check" weight="filled" size="18"></re-icon>
                    <span>Recibe novedades y promociones</span>
                </li>
            </ul>
        </div>
    </aside>

    <div class="auth-form">
        <form id="login-form" novalidate>
            <h2>Iniciar sesión</h2>
            <p class="auth-form__subtitulo">
                Accede con tu correo y contraseña.
            </p>

            <label class="auth-form__campo">
                <span>Correo electrónico</span>
                <input class="input" type="email" id="login-email" required autocomplete="email">
            </label>

            <label class="auth-form__campo">
                <span>Contraseña</span>
                <input class="input" type="password" id="login-password" required autocomplete="current-password">
            </label>

            <p class="auth-form__error" id="login-error" role="alert" aria-live="polite"></p>

            <button type="submit" class="btn btn--primary btn--block" id="login-enviar">
                Iniciar sesión
            </button>

            <p class="auth-form__link">
                ¿No tienes cuenta?
                <a href="#/register">Regístrate</a>
            </p>
        </form>
    </div>
</section>
