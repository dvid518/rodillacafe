<script>
/* Antes que el modulo: si el import a esm.sh o cualquier sentencia del
   modulo falla, este listener sigue vivo y deja constancia. Registrado
   dentro del modulo no serviria de nada, porque el modulo es justo lo que
   no llega a ejecutarse. */
window.__err = []
addEventListener("error", e => {
  window.__err.push(`error: ${e.message} @ ${e.filename?.split("/").pop()}:${e.lineno}`)
  document.getElementById("r").textContent = window.__err.join("\n")
  document.getElementById("t").textContent = "ERROR"
  document.getElementById("t").className = "mal"
}, true)
addEventListener("unhandledrejection", e => {
  window.__err.push(`rechazo: ${e.reason?.message || e.reason}`)
  document.getElementById("r").textContent += "\n" + window.__err[window.__err.length - 1]
})
/* marcas de paso: si el modulo se queda colgado, se ve hasta donde llego */
window.__paso = s => { document.getElementById("r").textContent += `\n[${s}]` }
</script>

<script type="module">
/* ==========================================================================
   EJECUTA LOS CONTROLADORES REALES CONTRA SUPABASE DOBLE
   --------------------------------------------------------------------------
   supabase es el objeto que exporta lib/supabaseClient.js. Se sustituyen
   from() y auth() por dobles encadenables, de modo que los controladores,
   los adapters y los services que importan son los de verdad: lo que se
   comprueba aqui es el render y la logica, no el HTTP a Supabase.
   ========================================================================== */
window.__paso("antes de supabaseClient")
import { supabase } from "../js/lib/supabaseClient.js"
window.__paso("supabaseClient importado; typeof supabase = " + typeof supabase)

const lineas = []
const malas = []
const errores = []
const log = s => { lineas.push(s); document.getElementById("r").textContent = lineas.join("\n") }

const mal = m => { log(`  FALLA ${m}`); malas.push(m) }
window.addEventListener("error", e => errores.push(`window.onerror: ${e.message}`))
window.addEventListener("unhandledrejection", e => errores.push(`promesa sin catch: ${e.reason}`))

  PEDIDO: PEDIDOS, RESERVA: RESERVAS, MENSAJE: MENSAJES, DETALLE_PEDIDO: [],
}

/* ---------- doble encadenable ---------- */

function fila(q) {
  let datos = TABLAS[q._tabla] || []
  for (const [col, val] of q._filtros) {
    if (col === "ESTADO") datos = datos.filter(d => d[col] === val)
    else if (col in (datos[0] || {})) datos = datos.filter(d => d[col] === val)
  }
  return datos
}

supabase.from = (tabla) => {
  const q = {
    _tabla: tabla, _filtros: [],
    select() { return q },
    eq(c, v) { q._filtros.push([c, v]); return q },
    neq() { return q },
    order() { return q },
    limit() { return q },
    insert(d) { q._insert = d; return q },
    update(d) { q._update = d; return q },
    delete() { return q },
    maybeSingle() { return Promise.resolve({ data: fila(q)[0] ?? null, error: null }) },
    single() { return Promise.resolve({ data: fila(q)[0] ?? null, error: null }) },
    then(resolve, reject) { return Promise.resolve({ data: fila(q), error: null }).then(resolve, reject) },
  }
  return q
}
supabase.auth = {
  getSession: async () => ({ data: { session: { user: { id: "auth-1", email: "admin@rodilla.pe" } } }, error: null }),
  getUser: async () => ({ data: { user: { id: "auth-1", email: "admin@rodilla.pe" } }, error: null }),
  onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }),
}
supabase.rpc = async (nombre) => {
  if (nombre === "is_rol") return { data: true, error: null }
  return { data: true, error: null }
}

/* ---------- ejecucion ---------- */

const app = document.getElementById("app")

async function montar(vista, fn, etiqueta) {
  app.replaceChildren()
  const html = await (await fetch(`../views/dashboard/${vista}.html`)).text()
  app.innerHTML = html
  const contenedor = app.firstElementChild
  try {
    const cleanup = await fn(contenedor)
    return { ok: true, contenedor, cleanup: typeof cleanup === "function" ? cleanup : null }
  } catch (e) {
    mal(`${etiqueta} lanzo: ${e.message}`)
    console.error(e)
    return { ok: false }
  }
}

window.__paso("controladores importando")
const { pedidosController } = await import("../js/views/dashboard/pedidos.js")
const { reservasController } = await import("../js/views/dashboard/reservas.js")
const { mensajesController } = await import("../js/views/dashboard/mensajes.js")
const { usuariosController } = await import("../js/views/dashboard/usuarios.js")
const { misPedidosController } = await import("../js/views/dashboard/mis-pedidos.js")
const { misReservasController } = await import("../js/views/dashboard/mis-reservas.js")
const { misMensajesController } = await import("../js/views/dashboard/mis-mensajes.js")
const { cartaController } = await import("../js/views/dashboard/carta.js")
const { categoriasController } = await import("../js/views/dashboard/categorias.js")

window.__paso("controladores importados")
const n = sel => document.querySelectorAll(`#app ${sel}`).length
const txt = sel => document.querySelector(`#app ${sel}`)?.textContent?.trim() || ""

log("== PEDIDOS (admin) ==")
let r = await montar("pedidos", pedidosController, "pedidosController")
if (r.ok) {
  n("tbody#pedidos-tbody tr") === 2 ? ok("2 filas de pedido") : mal(`filas = ${n("tbody#pedidos-tbody tr")}`)
  txt("#pedidos-tbody tr td:nth-child(2)").includes("Quispe") ? ok("columna Cliente con nombre real") : mal(`cliente = "${txt("#pedidos-tbody tr td:nth-child(2)")}"`)
  n("#pedidos-tbody .chip") === 2 ? ok("2 chips de estado") : mal(`chips = ${n("#pedidos-tbody .chip")}`)
  n("#pedidos-tbody svg") >= 6 ? ok(`${n("#pedidos-tbody svg")} iconos de accion`) : mal(`svg = ${n("#pedidos-tbody svg")}`)
  document.querySelector("#app #pedidos-modal").hidden ? ok("modal cerrado al entrar") : mal("modal ABIERTO al entrar")
  document.querySelector("#app #pedidos-detalle-modal").hidden ? ok("modal detalle cerrado al entrar") : mal("modal detalle ABIERTO")
  n("#pedidos-input-cliente option") === 3 ? ok(`select cliente con ${n("#pedidos-input-cliente option")} opciones (2 + placeholder)`) : mal(`opciones = ${n("#pedidos-input-cliente option")}`)
  n("#pedidos-input-tipo option") === 2 ? ok("select tipo cargado desde la BD, no hardcodeado") : mal(`tipos = ${n("#pedidos-input-tipo option")}`)

  // abrir detalle
  document.querySelector("#app [data-accion=detalle]").click()
  await new Promise(res => setTimeout(res, 200))
  const d = document.querySelector("#pedidos-detalle-contenido").innerHTML
  d.includes("Tiramisu") ? ok("el detalle pinta el producto del DETALLE_PEDIDO") : mal("el detalle no trae productos")
  !document.querySelector("#app #pedidos-detalle-modal").hidden ? ok("el modal detalle se abre") : mal("el modal detalle no se abre")

  // abrir alta y comprobar el total en vivo
  document.querySelector("#app #pedidos-detalle-cerrar").click()
  document.querySelector("#app #pedidos-nuevo").click()
  await new Promise(res => setTimeout(res, 200))
  !document.querySelector("#app #pedidos-modal").hidden ? ok("el modal de alta se abre") : mal("el modal de alta no se abre")
  document.querySelector("#app #pedidos-items .item-producto").value = "1"
  document.querySelector("#app #pedidos-items .item-cantidad").value = "3"
  document.querySelector("#app #pedidos-items .item-producto").dispatchEvent(new Event("change"))
  const total = txt("#pedidos-total")
  total === "S/ 18.00" ? ok(`total en vivo = ${total} (3 × 6.00)`) : mal(`total = "${total}", se esperaba S/ 18.00`)

  // el atributo hidden tiene que ocultar de verdad, no solo estar puesto
  const campoEstado = document.querySelector("#app #pedidos-campo-estado")
  campoEstado.hidden && getComputedStyle(campoEstado).display === "none"
    ? ok("el campo Estado con hidden no se ve (display:none de verdad)")
    : mal(`campo Estado: hidden=${campoEstado.hidden} display=${getComputedStyle(campoEstado).display}`)
  document.querySelector("#app #pedidos-items-fieldset").hidden === false
    ? ok("en alta el fieldset de productos si se ve") : mal("en alta faltan los productos")
  r.cleanup?.()
}

log("")
log("== RESERVAS ==")

  document.querySelector("#app #reservas-campo-estado").hidden ? ok("en alta no se muestra el estado") : mal("en alta se muestra el estado")

}

log("")

}

log("")

r = await montar("pedidos", pedidosController, "pedidos")
if (r.ok) {

    ? mal("el cleanup deja el scroll bloqueado") : ok("el cleanup quita sin-scroll")

  if (r.ok) {
    document.querySelector("#app #pedidos-nuevo").click()

await new Promise(res => setTimeout(res, 400))

log("")

  ["categorias", categoriasController, "cat-modal", "cat-modal-eliminar"],

const T = document.getElementById("t")
